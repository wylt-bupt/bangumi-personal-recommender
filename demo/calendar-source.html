<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的放送表 · 发布源码</title><style>body{max-width:1000px;margin:32px auto;padding:0 16px;font:14px/1.7 Arial,"Microsoft YaHei",sans-serif;color:#444}textarea{box-sizing:border-box;width:100%;height:65vh;font:12px/1.5 monospace}button{padding:10px 16px}a{color:#a74458}</style><h1>我的放送表 <small id="version"></small></h1><p>复制到独立的 Bangumi 组件或用户脚本管理器。<a href="calendar.html">布局预览</a> · <a href="index.html">预览导航</a></p><button id="copy">复制脚本</button> <span id="status" role="status"></span><p><textarea id="source" readonly aria-label="我的放送表源码"></textarea></p><script>
fetch('../dist/bangumi-personal-calendar.user.js').then(r=>{if(!r.ok)throw new Error('源码读取失败');return r.text()}).then(text=>{document.getElementById('source').value=text;document.getElementById('version').textContent=text.match(/@version\s+(\S+)/)?.[1]||''}).catch(e=>document.getElementById('status').textContent=e.message);
document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(document.getElementById('source').value);document.getElementById('status').textContent='已复制'}catch{document.getElementById('source').select();document.getElementById('status').textContent='请按 Ctrl+C 复制'}};
</script></html>
