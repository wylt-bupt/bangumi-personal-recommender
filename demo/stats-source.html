<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>动画回顾 · 发布源码</title>
<style>body{max-width:900px;margin:28px auto;padding:0 18px;font:14px/1.6 system-ui,sans-serif;color:#333}textarea{display:block;width:100%;height:65vh;margin-top:14px;font:11px/1.45 monospace}p{color:#666}button{padding:8px 14px;font:inherit;color:#16718b;background:#fafafa;border:1px solid #eee;border-radius:6px;cursor:pointer}a{color:#16718b}</style></head>
<body><h1>动画回顾 · 发布源码</h1><p id="status">正在载入本地构建产物…</p><button id="copy">复制脚本</button> <a href="profile.html">布局预览</a> · <a href="index.html">预览导航</a><textarea id="script" readonly aria-label="可复制的完整组件脚本"></textarea>
<script>
fetch('../dist/bangumi-personal-stats.bgm.txt', {cache:'no-cache'})
  .then(response => {if(!response.ok)throw new Error(`HTTP ${response.status}`);return response.text()})
  .then(text => {document.getElementById('script').value=text;const version=text.match(/^\/\/ @version\s+(\S+)/m)?.[1]||'未知';document.getElementById('status').textContent=`版本 ${version} · ${text.length} 个字符。点入文本框后全选复制。`})
  .catch(error => {document.getElementById('status').textContent=`读取失败：${error.message}`});
document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(document.getElementById('script').value);document.getElementById('status').textContent='已复制'}catch{document.getElementById('script').select();document.getElementById('status').textContent='请按 Ctrl+C 复制'}};
</script></body></html>
