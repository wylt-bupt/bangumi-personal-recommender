name: Refresh personal recommendations

on:
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monthly-recommendations
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical runtime
        run: python -m pip install 'numpy>=2,<3'
      - name: Recompute from public collections
        run: node scripts/refresh-recommendations.cjs
      - name: Validate and publish aggregate feed
        run: |
          node -e "require('./src/recommendation-feed.cjs').parseFeed(require('./public/recommendations.json'))"
          git add public/recommendations.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: refresh monthly personal recommendations'
          git push origin HEAD:main
